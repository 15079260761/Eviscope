# Evidence-space scoring — 规范 sections 11/12/13/14.
# LOCK resolution policy (section 14): author config unavailable, therefore
# every missing value is fitted ON TRAIN ONLY (Dev confirms once, Test only
# consumes the frozen values).  Any unresolved LOCK_BEFORE_BUILD aborts the
# formal pipeline at stage 00.

substitutability:
  # frozen weights of Sub = I_valid * (alpha*S_sem + beta*S_rel + gamma*S_time);
  # alpha+beta+gamma == 1 (section 12.1).  Engineering defaults, frozen here.
  alpha: 0.5
  beta: 0.25
  gamma: 0.25
  tau_eq: "fit_on_train:median_sub_score_over_valid_gated_candidates"
  tau_sim: "fit_on_train:median_candidate_max_semantic_similarity"
  tau_min: "same_as_tau_eq"

valid_gate_checks:
  - negation_consistency
  - core_entity_consistency
  - subject_object_role
  - relation_logic
  - temporal_operator
  - answer_type
  - answer_preservation

# frozen minimal negation lexicon used by the negation-consistency gate
negation_markers: ["did not", "never", "no longer", "ceased", "not"]

relation_scores:
  identical: 1.0
  equivalence_table: 0.9
  inverse_table: 0.8
  otherwise: 0.0

# Distractor taxonomy (section 13): top-level categories + subtypes.
distractor_top_levels:
  confusable: [entity_confusable, relation_confusable, temporal_confusable,
               boundary_confusable, multi_hop_shortcut]
  contradictory: [negation_conflict, entity_conflict, relation_conflict,
                  time_conflict, answer_conflict]
